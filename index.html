<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
  <title>Séimh Psychotherapy</title>
</head>
<body>

  <img src="image/seimhlogo2.png">
  <h1>Séimh Psychotherapy</h1>
  <h2>Coming soon</h2>

<form id="form">
  <input type="text" name="name" placeholder="Your Name" title="Get in Touch" required>
  <input type="email" name="email" placeholder="Your Email" required>
  <textarea name="message" placeholder = "Your Message" required></textarea>
  <button type="submit">Submit</button>
</form>
  
<script>
  document.addEventListener("DOMContentLoaded", () => {

  const form = document.getElementById('form');
  const submitBtn = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      formData.append("access_key", "8a2b9f17-c66e-4a2a-a23b-9bfa90db6cab");

      const originalText = submitBtn.textContent;

      submitBtn.textContent = "Sending...";
      submitBtn.disabled = true;

      try {
          const response = await fetch("https://api.web3forms.com/submit", {
              method: "POST",
              body: formData
          });

          const data = await response.json();

          if (response.ok) {
              alert("Success! Your message has been sent.");
              form.reset();
          } else {
              alert("Error: " + data.message);
          }

      } catch (error) {
          alert("Something went wrong. Please try again.");
      } finally {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
      }
  });
});
</script>
  
</body>
</html>
